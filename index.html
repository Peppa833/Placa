<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Producción Electronica</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      padding: 50px 20px;
      overflow-x: hidden;
      background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #fbc2eb, #a6c1ee);
      background-size: 400% 400%;
      animation: fondoAnimado 12s ease infinite;
    }

    @keyframes fondoAnimado {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-size: 3.2rem;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 5px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.15);
      animation: aparecerArriba 0.8s ease-out;
    }

    @keyframes aparecerArriba {
      from { opacity: 0; transform: translateY(-25px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin-top: 30px;
      animation: aparecerArriba 0.8s ease-out 0.15s both;
    }

    .tab-btn {
      border: none;
      background: rgba(255,255,255,0.6);
      color: #2c3e50;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      padding: 10px 26px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    }

    .tab-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    .tab-btn.activa {
      background: #2c3e50;
      color: #ffffff;
    }

    .seccion {
      display: none;
      margin-top: 35px;
    }

    .seccion.activa {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      max-width: 900px;
      animation: aparecerArriba 0.5s ease-out both;
    }

    .tarjeta {
      position: relative;
      border-radius: 18px;
      width: 210px;
      height: 300px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
      opacity: 0;
      transform: translateY(30px) scale(0.9);
      animation: entrarTarjeta 0.6s ease-out forwards;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .tarjeta:nth-child(1) { animation-delay: 0.3s; }
    .tarjeta:nth-child(2) { animation-delay: 0.5s; }
    .tarjeta:nth-child(3) { animation-delay: 0.7s; }

    @keyframes entrarTarjeta {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .tarjeta:hover {
      transform: translateY(-10px) scale(1.04);
      box-shadow: 0 16px 30px rgba(0,0,0,0.28);
    }

    .tarjeta img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .tarjeta:hover img {
      transform: scale(1.1);
    }

    .tarjeta .overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 28px 14px 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 20%, rgba(0,0,0,0.55) 65%, rgba(0,0,0,0));
    }

    .tarjeta .overlay .nombre {
      margin: 0;
      font-weight: 600;
      color: #ffffff;
      font-size: 1rem;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
      transition: color 0.3s ease;
    }

    .tarjeta:hover .nombre {
      color: #f1c8ff;
    }

    .tarjeta .overlay .dato {
      margin: 4px 0 0;
      font-weight: 400;
      color: #eaeaea;
      font-size: 0.78rem;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }

    .doc-tarjeta {
      background: rgba(255,255,255,0.85);
      border-radius: 20px;
      padding: 50px 40px;
      width: 420px;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 10px 24px rgba(0,0,0,0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .doc-tarjeta:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 34px rgba(0,0,0,0.22);
    }

    .doc-tarjeta h3 {
      margin: 0 0 14px;
      color: #2c3e50;
      font-size: 1.6rem;
    }

    .doc-tarjeta p {
      margin: 0;
      color: #444;
      font-size: 1rem;
      font-weight: 400;
    }

    .doc-tarjeta a {
      display: inline-block;
      margin-top: 24px;
      background: #2c3e50;
      color: #fff;
      padding: 12px 30px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .doc-tarjeta a:hover {
      background: #8e44ad;
      transform: scale(1.05);
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
</head>
<body>
  <h1>Producción Electronica</h1>

  <div class="tabs">
    <button class="tab-btn activa" onclick="mostrarSeccion('integrantes', this)">Integrantes</button>
    <button class="tab-btn" onclick="mostrarSeccion('documentacion', this)">Documentación</button>
  </div>

  <div id="integrantes" class="seccion activa">
    <div class="tarjeta">
      <img src="Fotos_Integrantes/Alex.jpeg" alt="Alejandro Ruiz Corona">
      <div class="overlay">
        <p class="nombre">Alejandro Ruiz Corona</p>
        <p class="dato">Matrícula: 203982</p>
        <p class="dato">203982@iberopuebla.mx</p>
      </div>
    </div>
    <div class="tarjeta">
      <img src="Fotos_Integrantes/Cano.jpeg" alt="Jorge Fernando Cano Garcia">
      <div class="overlay">
        <p class="nombre">Jorge Fernando Cano Garcia</p>
        <p class="dato">Matrícula: 200763</p>
        <p class="dato">200763@iberopuebla.mx</p>
      </div>
    </div>
  </div>

  <div id="documentacion" class="seccion">
    <div class="doc-tarjeta">
      <h3>Documentacion uso de KiCad para fabricacion de placas</h3>
      <p>Uso de KiCad.</p>
    </div>
  </div>

  <script>
    function mostrarSeccion(id, btn) {
      document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activa'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('activa'));
      document.getElementById(id).classList.add('activa');
      btn.classList.add('activa');
    }
  </script>
</body>
</html>
